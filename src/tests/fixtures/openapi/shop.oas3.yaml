openapi: 3.0.3
info:
  title: 商城后台 API
  version: 1.2.0
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
tags:
  - name: order
  - name: category
  - name: auth
paths:
  /orders:
    get:
      operationId: listOrders
      summary: 订单列表
      tags: [order]
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: status
          in: query
          description: 订单状态筛选
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      total: { type: integer, description: 总条数 }
                      list:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
    post:
      operationId: createOrder
      summary: 创建订单
      tags: [order]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId: { type: string }
                quantity: { type: integer, example: 1 }
                remark: { type: string, description: 买家备注 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: 库存不足
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOrderDetail
      summary: 订单详情
      tags: [order]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
  /categories:
    get:
      operationId: listCategories
      summary: 商品分类树
      tags: [category]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /auth/login:
    post:
      operationId: login
      summary: 用户登录
      tags: [auth]
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer }
  schemas:
    OrderStatus:
      type: string
      enum: [PENDING, PAID, SHIPPED, CANCELLED]
    Order:
      type: object
      description: 订单
      required: [id, status, amount]
      properties:
        id: { type: string, example: "202501020001" }
        status:
          $ref: "#/components/schemas/OrderStatus"
        amount:
          type: integer
          description: 实付金额（分）
          example: 12800
        createdAt: { type: string, format: date-time, description: 下单时间 }
        buyerName: { type: string, nullable: true, description: 收货人 }
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            items:
              type: array
              description: 订单明细
              items:
                type: object
                properties:
                  skuName: { type: string, description: 商品名称 }
                  price: { type: integer, description: 单价（分） }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: 分类名称 }
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
